<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TambayLand | Confession Wall</title>
    <link rel="icon" type="image/png" href="favicon.ico"> 
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-moon"></i> TambayLand <span class="highlight">Wall</span>
            </div>
            <div class="server-status">
                <span class="dot"></span> Online
            </div>
        </header>

        <section class="composer">
            <div class="composer-card">
                <h2><i class="fa-solid fa-bullhorn"></i> Make a Confession</h2>
                <textarea id="noteInput" placeholder="Anong chika mo today? (What's your story?)..." maxlength="300"></textarea>
                
                <div class="composer-tools">
                    <div class="tool-group">
                        <label>Vibe Color:</label>
                        <div class="color-options">
                            <div class="color-btn active" data-color="linear-gradient(135deg, #FF0055, #FF0099)" style="background: #FF0055;"></div> <div class="color-btn" data-color="linear-gradient(135deg, #00C9FF, #92FE9D)" style="background: #00C9FF;"></div> <div class="color-btn" data-color="linear-gradient(135deg, #FDBB2D, #22C1C3)" style="background: #FDBB2D;"></div> <div class="color-btn" data-color="linear-gradient(135deg, #4b6cb7, #182848)" style="background: #182848;"></div> </div>
                    </div>

                    <div class="tool-group">
                        <select id="tagInput">
                            <option value="Chika">Chika / Gossip</option>
                            <option value="Confession">Confession</option>
                            <option value="Love Letter">Love Letter</option>
                            <option value="Rant">Rant</option>
                            <option value="Meme">Meme</option>
                        </select>
                    </div>

                    <button id="postBtn" onclick="postNote()">
                        Post sa Wall <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="feed">
            <div class="feed-header">
                <h3>Latest Ganaps</h3>
                <button class="refresh-btn" onclick="fetchNotes()">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>
            <div id="notesGrid" class="notes-grid">
                <div class="loader">Loading tambay updates...</div>
            </div>
        </section>
    </div>

    <div id="commentModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalOriginalNote"></div>
            <div class="comments-section">
                <h4>Comments</h4>
                <div id="commentsList"></div>
                <div class="comment-input-area">
                    <input type="text" id="commentInput" placeholder="Reply anonymously..." />
                    <button onclick="postComment()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
